<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weights And Biases</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --or:#F97316;--or-dk:#C2570D;--or2:rgba(249,115,22,0.08);--or3:rgba(249,115,22,0.20);
  --bg:#0a0a0a;--bg2:#141414;--bg3:#1c1c1c;--bg4:#242424;
  --bdr:rgba(255,255,255,0.06);--bdr2:rgba(255,255,255,0.11);
  --txt:#ededed;--txt2:#888;--txt3:#444;
  --green:#22c55e;--green2:rgba(34,197,94,0.09);--gbdr:rgba(34,197,94,0.22);
  --gold:#F59E0B;--gold2:rgba(245,158,11,0.10);--goldbdr:rgba(245,158,11,0.25);
  --blue:#60A5FA;--blue2:rgba(96,165,250,0.10);--bluebdr:rgba(96,165,250,0.25);
  --chrome:linear-gradient(135deg,#555 0%,#c8c8c8 40%,#777 60%,#aaa 100%);
  --display:'Bebas Neue',cursive;--mono:'DM Mono',monospace;--body:'Manrope',sans-serif;
  --radius:10px;--shadow:0 2px 12px rgba(0,0,0,0.5);
}
body.light{
  --bg:#f4f4f4;--bg2:#ffffff;--bg3:#ebebeb;--bg4:#e0e0e0;
  --bdr:rgba(0,0,0,0.07);--bdr2:rgba(0,0,0,0.13);
  --txt:#111111;--txt2:#555555;--txt3:#aaaaaa;
  --or2:rgba(249,115,22,0.07);--or3:rgba(249,115,22,0.18);
  --chrome:linear-gradient(135deg,#333 0%,#888 40%,#444 60%,#666 100%);
  --shadow:0 2px 12px rgba(0,0,0,0.12);
}
html{background:var(--bg)}
body{font-family:var(--body);font-size:14px;line-height:1.5;color:var(--txt);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:2px}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}

/* ── TOAST ─────────────────────────────────────────── */
#_toast{position:fixed;top:14px;right:14px;z-index:9999;background:var(--or);color:#fff;font-family:var(--mono);font-size:11px;font-weight:500;padding:5px 13px;border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none}
#_toast.visible{opacity:1}

/* ── COMPLETION MODAL ───────────────────────────────── */
#_modal{display:none;position:fixed;inset:0;z-index:8888;background:rgba(0,0,0,0.85);backdrop-filter:blur(6px);align-items:flex-end;justify-content:center}
#_modal.open{display:flex}
.modal-card{width:100%;max-width:520px;max-height:90vh;overflow-y:auto;background:var(--bg2);border:0.5px solid var(--bdr2);border-bottom:none;border-radius:18px 18px 0 0;animation:slideUp .3s cubic-bezier(.16,1,.3,1)}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-header{background:var(--or);padding:24px 20px 18px;text-align:center}
.modal-check{width:48px;height:48px;background:rgba(255,255,255,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;margin:0 auto 10px;border:1.5px solid rgba(255,255,255,0.4)}
.modal-title{font-family:var(--display);font-size:32px;letter-spacing:.04em;color:#fff;line-height:1}
.modal-date{font-family:var(--mono);font-size:10px;color:rgba(255,255,255,0.7);margin-top:6px;letter-spacing:.05em}
.modal-badge{display:inline-block;margin-top:8px;background:rgba(0,0,0,0.25);color:#fff;font-family:var(--mono);font-size:10px;font-weight:500;padding:3px 10px;border-radius:12px;letter-spacing:.06em;text-transform:uppercase}
.modal-body{padding:14px 18px}
.modal-stat-box{background:var(--or2);border:0.5px solid var(--or3);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.modal-stat-row{display:flex;justify-content:space-between;padding:8px 13px;font-size:12px;border-bottom:0.5px solid var(--bdr)}
.modal-stat-row:last-child{border-bottom:none}
.modal-stat-row span:first-child{color:var(--txt2)}.modal-stat-row span:last-child{color:var(--or);font-family:var(--mono);font-weight:500}
.modal-ex{margin-bottom:12px;background:var(--bg3);border:0.5px solid var(--bdr);border-radius:var(--radius);overflow:hidden}
.modal-ex-hdr{padding:9px 13px;border-bottom:0.5px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.modal-ex-name{font-size:12px;font-weight:600;color:var(--or);font-family:var(--mono)}
.modal-ex-badges{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.modal-set-row{display:flex;justify-content:space-between;align-items:center;padding:7px 13px;border-bottom:0.5px solid var(--bdr);font-size:12px}
.modal-set-row:last-child{border-bottom:none}
.modal-set-row.is-atpb{background:var(--gold2)}
.modal-set-n{color:var(--txt3);font-family:var(--mono);font-size:10px}.modal-set-data{color:var(--txt);font-family:var(--mono)}
.modal-no-data{padding:9px 13px;font-size:11px;color:var(--txt3);font-family:var(--mono)}
.modal-notes-box{background:var(--bg3);border:0.5px solid var(--bdr);border-radius:var(--radius);padding:11px 13px;margin-bottom:12px}
.modal-notes-label{font-family:var(--mono);font-size:9px;color:var(--txt3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.modal-notes-text{font-size:12px;color:var(--txt2);line-height:1.6}
.modal-actions{display:flex;gap:8px;padding:0 18px 20px;margin-top:4px}
.modal-share-btn{flex:1;padding:13px;background:var(--or);border:none;border-radius:var(--radius);color:#fff;font-family:var(--display);font-size:18px;letter-spacing:.08em;cursor:pointer;transition:background .15s,transform .1s;display:flex;align-items:center;justify-content:center;gap:6px}
.modal-share-btn:hover{background:var(--or-dk)}.modal-share-btn:active{transform:scale(.98)}
.modal-close-btn{flex:1;padding:13px;background:var(--bg4);border:0.5px solid var(--bdr2);border-radius:var(--radius);color:var(--txt2);font-family:var(--mono);font-size:12px;font-weight:500;cursor:pointer;transition:background .15s,color .15s;letter-spacing:.04em;text-transform:uppercase}
.modal-close-btn:hover{background:var(--bg3);color:var(--txt)}

/* ── VIDEO MODAL ────────────────────────────────────── */
#_vmodal{display:none;position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,0.96);backdrop-filter:blur(8px);flex-direction:column;align-items:center;justify-content:center;padding:20px}
#_vmodal.open{display:flex}
.vmodal-inner{width:100%;max-width:520px}
.vmodal-header{display:flex;align-items:center;justify-content:space-between;padding:0 0 12px}
.vmodal-title{font-family:var(--display);font-size:22px;letter-spacing:.04em;color:#fff;line-height:1}
.vmodal-close{width:32px;height:32px;border-radius:8px;background:var(--bg3);border:0.5px solid var(--bdr2);color:var(--txt2);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.vmodal-close:hover{border-color:var(--or);color:var(--or)}
.vmodal-badge{display:inline-block;margin-bottom:10px;font-family:var(--mono);font-size:9px;color:var(--or);letter-spacing:.1em;text-transform:uppercase}
.vmodal-video-wrap{width:100%;border-radius:12px;overflow:hidden;background:#000;border:0.5px solid var(--bdr2);aspect-ratio:16/9;position:relative}
.vmodal-video-wrap video{width:100%;height:100%;object-fit:contain;display:block}
.vmodal-hint{font-family:var(--mono);font-size:10px;color:var(--txt3);text-align:center;margin-top:10px;letter-spacing:.04em}
.vmodal-placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--bg3)}
.vmodal-placeholder-icon{font-size:32px;opacity:.25}
.vmodal-placeholder-text{font-family:var(--mono);font-size:10px;color:var(--txt3);letter-spacing:.06em;text-transform:uppercase;text-align:center;line-height:1.8}

/* ── APP ────────────────────────────────────────────── */
.app{max-width:520px;margin:0 auto;padding:0 14px 80px}

/* ── HERO ───────────────────────────────────────────── */
.hero{padding:28px 0 22px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:0;left:-14px;right:-14px;bottom:0;background:repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(249,115,22,0.03) 39px,rgba(249,115,22,0.03) 40px),repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(249,115,22,0.03) 39px,rgba(249,115,22,0.03) 40px);pointer-events:none}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.hero-eyebrow{font-family:var(--mono);font-size:10px;color:var(--or);letter-spacing:.12em;margin-bottom:6px;text-transform:uppercase}
.hero-wordmark{display:block;font-family:var(--display);font-size:clamp(52px,14vw,72px);line-height:.92;letter-spacing:.02em;color:var(--txt)}
.hero-wordmark em{font-style:normal;background:var(--chrome);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-and{display:block;font-family:var(--mono);font-size:11px;color:var(--txt3);letter-spacing:.18em;text-transform:uppercase;padding:4px 0}
.hero-sub{font-family:var(--mono);font-size:10px;color:var(--txt3);letter-spacing:.08em;margin-top:10px;text-transform:uppercase;border-top:0.5px solid var(--bdr);padding-top:10px}

/* Theme toggle */
.theme-toggle{display:flex;align-items:center;gap:0;background:var(--bg3);border:0.5px solid var(--bdr2);border-radius:20px;overflow:hidden;flex-shrink:0;margin-top:4px;box-shadow:var(--shadow)}
.theme-btn{font-size:14px;padding:7px 10px;border:none;background:transparent;cursor:pointer;transition:background .15s;line-height:1;display:flex;align-items:center;justify-content:center}
.theme-btn.active{background:var(--or)}
.theme-btn:hover:not(.active){background:var(--or2)}

/* ── TIMER ──────────────────────────────────────────── */
#timer-container{position:sticky;top:0;z-index:100;margin:0 -14px;background:var(--bg);border-bottom:0.5px solid var(--bdr2);padding:10px 14px;transition:background .25s}
.rt-label{font-family:var(--mono);font-size:9px;color:var(--txt3);letter-spacing:.1em;text-transform:uppercase;width:100%;margin-bottom:4px}
.rt-inner{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rt-presets{display:flex;gap:5px;flex-shrink:0}
.rt-preset{font-family:var(--mono);font-size:11px;font-weight:500;padding:6px 10px;background:var(--bg3);border:0.5px solid var(--bdr2);border-radius:7px;color:var(--txt3);cursor:pointer;transition:all .15s;white-space:nowrap}
.rt-preset.rt-on{background:var(--or3);border-color:var(--or);color:var(--or)}
.rt-display{font-family:var(--display);font-size:38px;letter-spacing:.04em;color:var(--txt);line-height:1;flex:1;text-align:center;min-width:90px;transition:color .2s}
.rt-display.running{color:var(--or)}.rt-display.done{color:var(--green)}
@keyframes timerFlash{0%,100%{color:var(--green)}30%,70%{color:#fff;text-shadow:0 0 20px var(--green)}}
.rt-display.flash{animation:timerFlash .35s ease 4}
.rt-controls{display:flex;gap:5px;flex-shrink:0}
.rt-btn{font-family:var(--mono);font-size:11px;font-weight:500;padding:6px 12px;border-radius:7px;cursor:pointer;border:0.5px solid var(--bdr2);transition:all .15s;white-space:nowrap}
.rt-btn-start{background:var(--or);border-color:var(--or);color:#fff}.rt-btn-start:hover{background:var(--or-dk)}
.rt-btn-start.paused{background:var(--bg3);border-color:var(--or);color:var(--or)}
.rt-btn-reset{background:var(--bg3);color:var(--txt3)}.rt-btn-reset:hover{color:var(--txt)}

/* ── MAIN ───────────────────────────────────────────── */
#main-content{padding-top:14px}

/* ── TABS ───────────────────────────────────────────── */
.tabs-wrap{overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.tabs-wrap::-webkit-scrollbar{height:0}
.tabs{display:flex;gap:5px;min-width:max-content}
.tab{min-width:64px;padding:8px 6px 7px;background:var(--bg2);border:0.5px solid var(--bdr);border-radius:var(--radius);cursor:pointer;text-align:center;transition:background .15s,border-color .15s}
.tab:hover:not(.active){border-color:var(--bdr2)}.tab.active{background:var(--or);border-color:var(--or)}
.tab-name{font-family:var(--mono);font-size:9px;font-weight:500;color:var(--txt2);letter-spacing:.05em;text-transform:uppercase}
.tab-sub{font-size:10px;font-weight:600;color:var(--txt3);margin-top:2px}
.tab.active .tab-name,.tab.active .tab-sub{color:#fff}

/* ── DAY HEADER ─────────────────────────────────────── */
.day-hdr{border-left:3px solid var(--or);background:var(--bg2);border-radius:0 var(--radius) var(--radius) 0;padding:12px 16px;margin-bottom:10px;border-top:0.5px solid var(--bdr);border-right:0.5px solid var(--bdr);border-bottom:0.5px solid var(--bdr)}
.dh-title{font-family:var(--display);font-size:26px;letter-spacing:.04em;color:var(--txt);line-height:1}
.dh-sub{font-family:var(--mono);font-size:10px;color:var(--txt2);margin-top:4px;letter-spacing:.04em}

/* ── NOTE BOX ───────────────────────────────────────── */
.note-box{background:var(--or2);border:0.5px solid var(--or3);border-radius:var(--radius);padding:11px 14px;font-size:12px;color:var(--txt2);line-height:1.75;margin-bottom:10px}
.note-box b{color:var(--or);font-weight:600}

/* ── COUNTER ────────────────────────────────────────── */
.counter-bar{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;background:var(--bg2);border:0.5px solid var(--bdr);border-radius:var(--radius);margin-bottom:8px}
.counter-label{font-family:var(--mono);font-size:10px;color:var(--txt3);letter-spacing:.05em;text-transform:uppercase}
.counter-right{display:flex;align-items:center;gap:12px}
.counter-num{font-family:var(--display);font-size:22px;color:var(--or);letter-spacing:.04em;line-height:1}
.session-clock{font-family:var(--mono);font-size:11px;color:var(--txt3);letter-spacing:.04em}
.session-clock.ticking{color:var(--or)}

/* ── EXERCISE CARDS ─────────────────────────────────── */
.ex-list{display:flex;flex-direction:column;gap:6px}
.ex-card{background:var(--bg2);border:0.5px solid var(--bdr);border-radius:var(--radius);overflow:hidden;transition:border-color .15s}
.ex-card.ex-sel{border-color:var(--or)}
.ex-top{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;transition:background .12s;user-select:none;width:100%;border:none;background:transparent;font:inherit;text-align:left;}
.ex-top:hover{background:rgba(255,255,255,0.015)}.ex-top:active{background:rgba(249,115,22,0.04)}
.chk{width:20px;height:20px;border-radius:5px;border:0.5px solid var(--bdr2);background:var(--bg3);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s,border-color .15s}
.chk.on{background:var(--or);border-color:var(--or)}
.ex-info{flex:1;min-width:0}
.ex-name{font-size:13px;font-weight:600;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-meta{font-family:var(--mono);font-size:10px;color:var(--txt3);margin-top:2px}
.ex-badge{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.ex-stars{font-size:11px;letter-spacing:1px}
.ex-sets{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--or)}

/* ── FORM GUIDE ─────────────────────────────────────── */
.form-guide-bar{display:flex;align-items:center;gap:8px;padding:7px 12px;border-top:0.5px solid var(--bdr);background:rgba(0,0,0,0.1)}
.form-guide-btn{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;font-weight:500;color:var(--txt3);padding:5px 10px;border-radius:7px;border:0.5px solid var(--bdr2);background:var(--bg3);cursor:pointer;transition:all .15s;letter-spacing:.04em;text-transform:uppercase}
.form-guide-btn:hover{border-color:var(--or);color:var(--or)}
.form-guide-btn.fg-open{background:var(--or2);border-color:var(--or);color:var(--or)}
.fg-icon{font-size:12px;transition:transform .2s}.form-guide-btn.fg-open .fg-icon{transform:rotate(90deg)}
.fg-fullscreen-btn{margin-left:auto;display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9px;color:var(--txt3);padding:4px 8px;border-radius:6px;border:0.5px solid var(--bdr);background:transparent;cursor:pointer;transition:all .15s;text-transform:uppercase;letter-spacing:.05em}
.fg-fullscreen-btn:hover{border-color:var(--or);color:var(--or)}
.inline-video-panel{border-top:0.5px solid var(--bdr);background:#000}
.inline-video-wrap{width:100%;aspect-ratio:16/9;position:relative;background:#000}
.inline-video-wrap video{width:100%;height:100%;object-fit:contain;display:block}
.inline-placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--bg3)}
.inline-placeholder-icon{font-size:28px;opacity:.25}
.inline-placeholder-label{font-family:var(--mono);font-size:9px;color:var(--txt3);letter-spacing:.07em;text-transform:uppercase;text-align:center;line-height:1.9}
.inline-placeholder-url{font-family:var(--mono);font-size:8px;color:var(--or);opacity:.6;text-align:center;word-break:break-all;padding:0 16px}
.inline-video-footer{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;background:var(--bg3);border-top:0.5px solid var(--bdr)}
.ivf-label{font-family:var(--mono);font-size:9px;color:var(--txt3);letter-spacing:.05em;text-transform:uppercase}
.ivf-mute-hint{font-family:var(--mono);font-size:9px;color:var(--txt3);opacity:.6}

/* ── SET LOG ────────────────────────────────────────── */
.set-log{border-top:0.5px solid var(--bdr);padding:0 12px 0;background:rgba(0,0,0,0.12)}
.set-header{display:grid;grid-template-columns:24px 1fr 12px 52px 40px 28px;gap:5px;padding:7px 0 5px;font-family:var(--mono);font-size:9px;letter-spacing:.07em;color:var(--txt3);text-transform:uppercase;border-bottom:0.5px solid var(--bdr)}
.sh-c{text-align:center}
.set-row{display:grid;grid-template-columns:24px 1fr 12px 52px 40px 28px;gap:5px;align-items:center;padding:5px 0;border-bottom:0.5px solid rgba(128,128,128,0.08);transition:background .15s}
.set-row:last-child{border-bottom:none}
.set-row.set-done{background:var(--green2)}
.set-num{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--txt3);text-align:center;transition:color .15s}
.set-row.set-done .set-num{color:var(--green)}
.wt-cell{display:flex;align-items:center;gap:3px;min-width:0}
.set-in{width:100%;padding:5px 5px;background:var(--bg3);border:0.5px solid var(--bdr2);border-radius:6px;color:var(--txt);font-family:var(--mono);font-size:11px;font-weight:500;text-align:center;outline:none;transition:border-color .15s,color .15s;min-width:0}
.set-in:focus{border-color:var(--or)}.set-in::placeholder{color:var(--txt3)}
.set-row.set-done .set-in{color:var(--green);border-color:var(--gbdr)}
.bw-tog{font-family:var(--mono);font-size:9px;font-weight:500;padding:3px 5px;border-radius:5px;border:0.5px solid var(--bdr2);background:var(--bg4);color:var(--txt3);cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0;line-height:1.4}
.bw-tog:hover{border-color:var(--or);color:var(--or)}
.bw-chip{font-family:var(--mono);font-size:9px;font-weight:500;padding:3px 5px;border-radius:5px;background:var(--or);color:#fff;flex-shrink:0;line-height:1.4;white-space:nowrap}
.bw-plus{font-family:var(--mono);font-size:10px;color:var(--txt3);flex-shrink:0}
.set-extra{width:100%;min-width:0;padding:5px 4px;background:var(--bg3);border:0.5px solid var(--bdr2);border-radius:6px;color:var(--txt);font-family:var(--mono);font-size:11px;font-weight:500;text-align:center;outline:none;transition:border-color .15s}
.set-extra:focus{border-color:var(--or)}.set-extra::placeholder{color:var(--txt3)}
.set-x{font-family:var(--mono);font-size:11px;color:var(--txt3);text-align:center}
.set-unit-lbl{font-family:var(--mono);font-size:9px;color:var(--txt3);text-align:center;line-height:1.2}

//  STORAGE SHIM
//  Wraps localStorage in the same async interface as
//  the Claude artifact window.storage API so all
//  save/load calls work identically when deployed.
// ═══════════════════════════════════════════════════
window.storage = {
  set: async (key, value) => {
    try { localStorage.setItem('wab:'+key, String(value)); } catch(e) {}
    return { key, value };
  },
  get: async (key) => {
    const value = localStorage.getItem('wab:'+key);
    if (value === null) throw new Error('Key not found: '+key);
    return { key, value };
  },
  delete: async (key) => {
    localStorage.removeItem('wab:'+key);
    return { key, deleted: true };
  },
  list: async (prefix) => {
    const p = prefix ? 'wab:'+prefix : 'wab:';
    const keys = Object.keys(localStorage)
      .filter(k => k.startsWith(p))
      .map(k => k.slice(4)); // strip 'wab:' prefix
    return { keys };
  }
};

function startSessionClock(dayId) {
  if (!sessionStartTimes[dayId]) sessionStartTimes[dayId] = Date.now();
  if (!clockInterval) {
    // Capture dayId in closure — do NOT reference activeDay here, which could
    // change if the user switches tabs mid-session (Fix #4)
    const id = dayId;
    clockInterval = setInterval(() => {
      const el = document.getElementById('sess-clock');
      if (el) el.textContent = fmtDuration(Date.now() - (sessionStartTimes[id] || Date.now()));
    }, 1000);
  }
}
function fmtDuration(ms) {
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  if (h > 0) return `${h}h ${m}m`;
  if (m > 0) return `${m}m ${sec}s`;
  return `${sec}s`;
}

function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(persistAll, 900); }
async function persistAll() {
  // Each write independently guarded — one failure never silently drops subsequent writes
  try { await window.storage.set('wab_unit',  unit); } catch(e){}
  try { await window.storage.set('wab_theme', theme); } catch(e){}
  try { await window.storage.set('wab_notes', JSON.stringify(sessionNotes)); } catch(e){}
  // Persist session start times so clock survives page refresh (Fix #3)
  try { await window.storage.set('wab_start_times', JSON.stringify(sessionStartTimes)); } catch(e){}
  for (const d of DAYS) {
    try { await window.storage.set(`wab_day_${d.id}`, JSON.stringify({ selected:[...selected[d.id]], logs:logs[d.id] })); } catch(e){}
  }
  showToast('Saved ✓');
}
async function loadAll() {
  try { const r=await window.storage.get('wab_unit');  if(r?.value) unit=r.value; } catch(e){}
  try { const r=await window.storage.get('wab_theme'); if(r?.value) theme=r.value; } catch(e){}
  try { const r=await window.storage.get('wab_notes'); if(r?.value) sessionNotes={...sessionNotes,...JSON.parse(r.value)}; } catch(e){}
  for (const d of DAYS) {
    try { const r=await window.storage.get(`wab_day_${d.id}`); if(r?.value){const data=JSON.parse(r.value); selected[d.id]=new Set(Array.isArray(data.selected)?data.selected:[]); logs[d.id]=(data.logs&&typeof data.logs==='object')?data.logs:{};} } catch(e){}
  }
  try { const r=await window.storage.get('wab_history'); if(r?.value) sessionHistory=JSON.parse(r.value); } catch(e){}
  // Restore session start times — allows clock to survive a page refresh mid-session (Fix #3)
  try {
    const r=await window.storage.get('wab_start_times');
    if(r?.value){
      const stored=JSON.parse(r.value);
      for(const id of Object.keys(sessionStartTimes)){
        if(stored[id]) sessionStartTimes[id]=stored[id];
      }
    }
  } catch(e){}
}
async function saveSessionToHistory(day, sel, duration) {
  const now=new Date(); let totalVol=0;
  const exData=[...sel].sort((a,b)=>a-b).map(idx=>{
    const ex=day.exercises[idx], exLog=logs[day.id][idx]||[]; let exVol=0;
    exLog.forEach(s=>{ const r=parseInt(s.r)||0; exVol+=s.isBW?(parseFloat(s.extra)||0)*r:(parseFloat(s.w)||0)*r; }); totalVol+=exVol;
    return { name:ex.n, prescribed:ex.s, volume:exVol, hasBW:exLog.some(s=>s.isBW), sets:exLog.map(s=>({w:s.w,r:s.r,done:s.done,isBW:s.isBW,extra:s.extra})) };
  });
  const session = { id:now.getTime(), date:now.toISOString(), dayId:day.id, dayName:day.name, unit, totalVolume:totalVol, duration, notes:sessionNotes[day.id], exercises:exData };
  sessionHistory.unshift(session);
  if (sessionHistory.length>200) sessionHistory=sessionHistory.slice(0,200);
  invalidatePBCache(); // history changed — next render recomputes PB map (Fix #5)
  try { await window.storage.set('wab_history', JSON.stringify(sessionHistory)); } catch(e){}
}

//  PB
// ═══════════════════════════════════════════════════
// Memoised PB map — recomputed only when history changes (Fix #5)
let _pbCache = { map: null, len: -1, newestId: -1 };
function getCachedPBMap() {
  const len = sessionHistory.length;
  const newestId = len > 0 ? sessionHistory[0].id : -1;
  if (_pbCache.map && _pbCache.len === len && _pbCache.newestId === newestId) return _pbCache.map;
  _pbCache.map = buildPBMap(sessionHistory);
  _pbCache.len = len;
  _pbCache.newestId = newestId;
  return _pbCache.map;
}
function invalidatePBCache() { _pbCache.map = null; }
function buildPBMap(history) {
  const map={}, chrono=[...history].reverse();
  for (const sess of chrono) for (const ex of sess.exercises) {
    if(!map[ex.name]) map[ex.name]={allTimeW:0,allTimeR:0,bySession:[]};
    let bestW=0,bestR=0;
    for (const s of ex.sets) { const w=s.isBW?(parseFloat(s.extra)||0):(parseFloat(s.w)||0),r=parseInt(s.r)||0; if(w>bestW)bestW=w; if(r>bestR)bestR=r; if(w>map[ex.name].allTimeW)map[ex.name].allTimeW=w; if(r>map[ex.name].allTimeR)map[ex.name].allTimeR=r; }
    map[ex.name].bySession.push({id:sess.id,bestW,bestR});
  }
  return map;
}
function getPBFlags(pbMap, exName, sessId) {
  if(!pbMap[exName]) return{atW:false,atR:false,lsW:false,lsR:false,prevBestW:null,prevBestR:null};
  const{allTimeW,allTimeR,bySession}=pbMap[exName], idx=bySession.findIndex(s=>s.id===sessId), curr=bySession[idx];
  const atW=curr&&curr.bestW>0&&curr.bestW>=allTimeW, atR=curr&&curr.bestR>0&&curr.bestR>=allTimeR;
  let lsW=false,lsR=false,prevBestW=null,prevBestR=null;
  if(idx>0){ const prev=bySession[idx-1]; prevBestW=prev.bestW; prevBestR=prev.bestR; lsW=curr&&curr.bestW>0&&curr.bestW>prevBestW; lsR=curr&&curr.bestR>0&&curr.bestR>prevBestR; }
  return{atW,atR,lsW,lsR,prevBestW,prevBestR};
}

function calcVolume(dayId,exIdx) {
  const exLog=logs[dayId][exIdx]||[]; let totalW=0,hasBW=false,setsLogged=0,totalR=0;
  for(const s of exLog){ const r=parseInt(s.r)||0,w=s.isBW?(parseFloat(s.extra)||0):(parseFloat(s.w)||0); if(s.isBW)hasBW=true; totalW+=w*r; totalR+=r; if(r>0||w>0||s.isBW)setsLogged++; }
  return{totalW,totalR,hasBW,setsLogged};
}
function calcVolumeHTML(dayId,exIdx) {
  const{totalW,totalR,hasBW,setsLogged}=calcVolume(dayId,exIdx);
  const volStr=totalW>0?`<span class="vol-value">${totalW.toLocaleString()}</span><span class="vol-label">&nbsp;${unit} vol</span>`:(hasBW&&totalR>0?`<span class="vol-value">${totalR}</span><span class="vol-label">&nbsp;reps</span>`:`<span class="vol-label">No data yet</span>`);
  return`<div class="vol-strip"><div class="vol-left">${hasBW?'<span class="vol-bw">BW</span>':''}${volStr}</div><span class="vol-sets">${setsLogged} set${setsLogged!==1?'s':''} logged</span></div>`;
}
function updateVolumeDisplay(dayId,exIdx){ const el=document.getElementById(`vol-${dayId}-${exIdx}`); if(el) el.innerHTML=calcVolumeHTML(dayId,exIdx); }

function drawRoundRect(ctx, x, y, w, h, r, fill) {
  ctx.beginPath();
  ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath(); if(fill) { ctx.fillStyle=fill; ctx.fill(); }
}

function wrapText(ctx, text, maxW) {
  const words=text.split(' '), lines=[];
  let line='';
  for (const word of words) {
    const test=line?line+' '+word:word;
    if (ctx.measureText(test).width>maxW&&line) { lines.push(line); line=word; }
    else line=test;
  }
  if (line) lines.push(line);
  return lines;
}

function generateShareCard(sess, pbMap) {
  const W=800, PAD=44, OR='#F97316', OR_LT='rgba(249,115,22,0.08)', OR_BD='rgba(249,115,22,0.2)';
  const BG='#ffffff', BG2='#f8f8f8', BG3='#f0f0f0';
  const TXT='#111111', TXT2='#555555', TXT3='#aaaaaa', BORDER='rgba(0,0,0,0.07)';
  const GOLD='#F59E0B', GOLD_BG='rgba(245,158,11,0.12)';
  const GREEN='#22c55e', GREEN_BG='rgba(34,197,94,0.10)';

  // ── Height calculation ──────────────────────────
  let H = 0;
  H += 148;  // orange header
  H += 64;   // stats strip
  H += 16;   // gap
  for (const ex of sess.exercises) {
    H += 44;  // exercise header
    const vs=ex.sets.filter(s=>s.w||s.r||s.isBW);
    H += Math.max(vs.length,1)*28 + 4;
    H += 12;
  }
  // notes
  const canvas0=document.createElement('canvas');
  const ctx0=canvas0.getContext('2d');
  ctx0.font='13px Manrope,Arial,sans-serif';
  let notesLines=[];
  if (sess.notes) { notesLines=wrapText(ctx0, sess.notes, W-PAD*2-24); H+=20+notesLines.length*20+24; }
  H += 80; // footer

  const canvas=document.createElement('canvas');
  canvas.width=W; canvas.height=H;
  const ctx=canvas.getContext('2d');

  // ── Background ──────────────────────────────────
  ctx.fillStyle=BG; ctx.fillRect(0,0,W,H);

  // ── Header ──────────────────────────────────────
  ctx.fillStyle=OR; ctx.fillRect(0,0,W,148);

  // Grid pattern on header
  ctx.strokeStyle='rgba(255,255,255,0.08)'; ctx.lineWidth=0.5;
  for(let x=0;x<W;x+=40){ ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,148);ctx.stroke(); }
  for(let y=0;y<148;y+=40){ ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke(); }

  // Wordmark
  ctx.fillStyle='#fff';
  ctx.font=`bold 58px 'Bebas Neue',Arial Black,Arial,sans-serif`;
  ctx.letterSpacing='2px';
  ctx.fillText('WEIGHTS AND BIASES', PAD, 80);

  // Sub line
  ctx.font=`500 12px 'DM Mono',monospace`;
  ctx.fillStyle='rgba(255,255,255,0.75)';
  const dayLabel = sess.dayName.toUpperCase();
  const dateLabel = fmtDate(sess.date)+' · '+fmtTimeLbl(sess.date);
  const durLabel  = sess.duration ? ' · '+fmtDuration(sess.duration) : '';
  ctx.fillText(dayLabel+'   '+dateLabel+durLabel, PAD, 108);
  ctx.fillText('Strength · Shaping · Mass', PAD, 130);

  // ── Stats strip ─────────────────────────────────
  let sy=148;
  ctx.fillStyle='#111'; ctx.fillRect(0,sy,W,64);
  const totalSets=sess.exercises.reduce((a,ex)=>a+ex.sets.filter(s=>s.w||s.r||s.isBW).length,0);
  const doneSets=sess.exercises.reduce((a,ex)=>a+ex.sets.filter(s=>s.done).length,0);
  const stats=[
    [sess.exercises.length,'Exercises'],
    [totalSets,'Sets logged'],
    [doneSets,'Sets done'],
    [sess.totalVolume>0?sess.totalVolume.toLocaleString()+' '+sess.unit:'—','Volume'],
  ];
  const sw=W/stats.length;
  stats.forEach(([v,l],i)=>{
    const sx2=i*sw+sw/2;
    ctx.textAlign='center';
    ctx.fillStyle=OR; ctx.font=`bold 22px 'Bebas Neue',Arial Black,Arial,sans-serif`;
    ctx.fillText(String(v), sx2, sy+30);
    ctx.fillStyle='rgba(255,255,255,0.45)'; ctx.font=`500 9px 'DM Mono',monospace`;
    ctx.fillText(l.toUpperCase(), sx2, sy+46);
  });
  ctx.textAlign='left';

  // ── Exercises ───────────────────────────────────
  let y=148+64+16;
  for (const ex of sess.exercises) {
    const flags=getPBFlags(pbMap, ex.name, sess.id);
    const{atW,atR,lsW,lsR}=flags;
    const allTimeW=pbMap[ex.name]?.allTimeW||0, allTimeR=pbMap[ex.name]?.allTimeR||0;

    // Exercise row bg
    ctx.fillStyle=BG2; ctx.fillRect(PAD-4,y,W-PAD*2+8,40);
    ctx.fillStyle=OR; ctx.fillRect(PAD-4,y,4,40);

    // Name
    ctx.fillStyle=TXT; ctx.font=`700 13px Manrope,Arial,sans-serif`;
    ctx.fillText(ex.name, PAD+8, y+25);

    // Volume
    if (ex.volume>0) {
      ctx.font=`500 11px 'DM Mono',monospace`;
      ctx.fillStyle=OR; ctx.textAlign='right';
      ctx.fillText(ex.volume.toLocaleString()+' '+sess.unit, W-PAD, y+25);
      ctx.textAlign='left';
    }

    // PB Badges
    const badges=[];
    if(atW) badges.push(['★ WEIGHT PB', GOLD, GOLD_BG]);
    if(atR) badges.push(['★ REPS PB',   GOLD, GOLD_BG]);
    if(lsW&&!atW) badges.push(['↑ WEIGHT', GREEN, GREEN_BG]);
    if(lsR&&!atR) badges.push(['↑ REPS',   GREEN, GREEN_BG]);
    let bx=W-PAD-(ex.volume>0?70:0);
    ctx.font=`700 9px 'DM Mono',monospace`;
    for(let bi=badges.length-1;bi>=0;bi--){
      const[label,col,bg]=badges[bi];
      const bw=ctx.measureText(label).width+16;
      bx-=bw+5;
      drawRoundRect(ctx, bx, y+11, bw, 17, 4, bg);
      ctx.fillStyle=col; ctx.fillText(label, bx+8, y+23);
    }

    y+=44;

    // Sets
    const vs=ex.sets.filter(s=>s.w||s.r||s.isBW);
    if(vs.length===0){ ctx.font=`11px 'DM Mono',monospace`; ctx.fillStyle=TXT3; ctx.fillText('No data logged', PAD+12, y+18); y+=28; }
    else {
      vs.forEach((s,si)=>{
        if(si%2===1){ ctx.fillStyle=BG2; ctx.fillRect(PAD-4,y,W-PAD*2+8,27); }
        const w=s.isBW?(parseFloat(s.extra)||0):(parseFloat(s.w)||0), r=parseInt(s.r)||0;
        const isAT=(w>0&&w>=allTimeW)||(r>0&&r>=allTimeR);
        if(isAT){ ctx.fillStyle='rgba(245,158,11,0.07)'; ctx.fillRect(PAD-4,y,W-PAD*2+8,27); }
        ctx.font=`11px 'DM Mono',monospace`;
        ctx.fillStyle=TXT3; ctx.fillText(`Set ${si+1}`, PAD+10, y+18);
        const wStr=s.isBW?('BW'+(s.extra&&parseFloat(s.extra)>0?` +${s.extra} ${sess.unit}`:'')):( s.w?s.w+' '+sess.unit:'—');
        const rStr=s.r?`${s.r} reps`:'—';
        ctx.fillStyle=isAT?GOLD:TXT;
        ctx.fillText(`${wStr}  ×  ${rStr}`, PAD+70, y+18);
        if(isAT){ ctx.fillStyle=GOLD; ctx.fillText('★', W-PAD-24, y+18); }
        if(s.done){ ctx.fillStyle=GREEN; ctx.fillText('✓', W-PAD-8, y+18); }
        y+=27;
      });
    }
    // divider
    ctx.strokeStyle=BORDER; ctx.lineWidth=0.5;
    ctx.beginPath(); ctx.moveTo(PAD,y+6); ctx.lineTo(W-PAD,y+6); ctx.stroke();
    y+=18;
  }

  // ── Notes ───────────────────────────────────────
  if(sess.notes && notesLines.length>0) {
    const notesH=20+notesLines.length*20+20;
    drawRoundRect(ctx, PAD-4, y, W-PAD*2+8, notesH, 6, OR_LT);
    ctx.strokeStyle=OR_BD; ctx.lineWidth=0.5; ctx.strokeRect(PAD-4,y,W-PAD*2+8,notesH);
    ctx.font=`700 9px 'DM Mono',monospace`; ctx.fillStyle=OR;
    ctx.fillText('// SESSION NOTES', PAD+8, y+16);
    ctx.font=`13px Manrope,Arial,sans-serif`; ctx.fillStyle=TXT2;
    notesLines.forEach((ln,li)=>ctx.fillText(ln, PAD+8, y+32+li*20));
    y+=notesH+12;
  }

  // ── Footer ──────────────────────────────────────
  const footY=H-72;
  ctx.fillStyle=BG3; ctx.fillRect(0,footY,W,72);
  ctx.strokeStyle=BORDER; ctx.lineWidth=0.5;
  ctx.beginPath(); ctx.moveTo(0,footY); ctx.lineTo(W,footY); ctx.stroke();
  ctx.fillStyle=OR; ctx.font=`bold 9px 'DM Mono',monospace`;
  ctx.textAlign='center';
  ctx.fillText('WEIGHTS AND BIASES', W/2, footY+22);
  ctx.fillStyle=TXT3; ctx.font=`9px 'DM Mono',monospace`;
  ctx.fillText('Strength · Shaping · Mass · Progressive Overload Tracker', W/2, footY+40);
  const now=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  ctx.fillText('Generated '+now, W/2, footY+58);
  ctx.textAlign='left';

  return canvas;
}

function downloadCard(sess, pbMap) {
  showToast('Generating card…');
  setTimeout(() => {
    try {
      const canvas=generateShareCard(sess, pbMap);
      const link=document.createElement('a');
      link.download=`wab-${sess.dayId}-${sess.date.slice(0,10)}.png`;
      link.href=canvas.toDataURL('image/png');
      link.click();
      showToast('Card downloaded ✓');
      haptic('complete');
    } catch(e) { showToast('Export failed'); console.error(e); }
  }, 100);
}

// ═══════════════════════════════════════════════════
function setTimerDuration(s){ clearInterval(timerInterval);timerInterval=null;timerRunning=false;timerDuration=s;timerRemaining=s;renderTimer(); }
function startStopTimer(){
  haptic(timerRunning?'select':'timerGo');
  if(timerRunning){clearInterval(timerInterval);timerInterval=null;timerRunning=false;}
  else{if(timerRemaining<=0)timerRemaining=timerDuration;timerRunning=true;timerInterval=setInterval(tickTimer,1000);}
  renderTimer();
}
function resetTimer(){clearInterval(timerInterval);timerInterval=null;timerRunning=false;timerRemaining=timerDuration;renderTimer();}
function tickTimer(){timerRemaining--;if(timerRemaining<=0){timerRemaining=0;clearInterval(timerInterval);timerInterval=null;timerRunning=false;onTimerComplete();}renderTimer();}
function onTimerComplete(){haptic('timerEnd');playBeep();const d=document.getElementById('rtDisplay');if(d){d.classList.remove('running');d.classList.add('done','flash');d.addEventListener('animationend',()=>d.classList.remove('flash'),{once:true});}}
function playBeep(){try{const ctx=new(window.AudioContext||window.webkitAudioContext)(),now=ctx.currentTime;[0,0.22,0.44].forEach((off,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.value=i===2?1047:880;g.gain.setValueAtTime(0.35,now+off);g.gain.exponentialRampToValueAtTime(0.001,now+off+0.18);o.start(now+off);o.stop(now+off+0.2);});}catch(e){}}
function fmtTime(s){return`${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;}
function renderTimer(){
  const d=document.getElementById('rtDisplay'),sb=document.getElementById('rtStartBtn');if(!d||!sb)return;
  d.textContent=fmtTime(timerRemaining);d.classList.toggle('running',timerRunning);if(timerRemaining>0)d.classList.remove('done');
  sb.textContent=timerRunning?'Pause':'Start';sb.classList.toggle('paused',!timerRunning&&timerRemaining<timerDuration&&timerRemaining>0);
  document.querySelectorAll('.rt-preset').forEach(b=>b.classList.toggle('rt-on',parseInt(b.dataset.secs)===timerDuration));
}

// Sanitise user-generated strings before innerHTML injection (Fix #6)
function escapeHTML(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}
function parseSetCount(s){const m=s.match(/^(\d+)/);return m?parseInt(m[1]):3;}
function star(n){return Array.from({length:5},(_,i)=>`<span style="color:${i<n?'var(--or)':'var(--txt3)'}">${i<n?'★':'☆'}</span>`).join('');}
function cvtW(w,from,to){if(w===''||w==null)return w;const n=parseFloat(w);if(isNaN(n)||from===to)return w;return(Math.round((from==='kg'?n*2.2046:n/2.2046)*2)/2).toString();}
function initExLog(dayId,exIdx){if(!logs[dayId][exIdx]){const day=DAYS.find(d=>d.id===dayId),ex=day.exercises[exIdx],cnt=parseSetCount(ex.s),isBW=!!ex.defaultBW;logs[dayId][exIdx]=Array.from({length:cnt},()=>({w:'',r:'',done:false,isBW,extra:''}));}return logs[dayId][exIdx];}
let toastT;
function showToast(msg='Saved ✓'){const t=document.getElementById('_toast');if(!t)return;t.textContent=msg;t.classList.add('visible');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('visible'),2000);}
function fmtDate(iso){return new Date(iso).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});}
function fmtTimeLbl(iso){return new Date(iso).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}

function renderSessionCard(sess,pbMap){
  const isOpen=expandedSess.has(sess.id);
  let hasAT=false,hasLS=false;
  for(const ex of sess.exercises){const f=getPBFlags(pbMap,ex.name,sess.id);if(f.atW||f.atR)hasAT=true;if(f.lsW||f.lsR)hasLS=true;}
  const totalSets=sess.exercises.reduce((a,ex)=>a+ex.sets.filter(s=>s.w||s.r||s.isBW).length,0);
  const doneSets=sess.exercises.reduce((a,ex)=>a+ex.sets.filter(s=>s.done).length,0);
  const volStr=sess.totalVolume>0?`${sess.totalVolume.toLocaleString()} ${sess.unit}`:'—';
  const durStr=sess.duration?fmtDuration(sess.duration):'';
  const bodyHTML=isOpen?`<div class="sess-body">
    <div class="sess-stats">
      <div class="sess-stat"><div class="sess-stat-v">${sess.exercises.length}</div><div class="sess-stat-l">Exercises</div></div>
      <div class="sess-stat"><div class="sess-stat-v">${totalSets}</div><div class="sess-stat-l">Sets</div></div>
      <div class="sess-stat"><div class="sess-stat-v" style="color:var(--green)">${doneSets}</div><div class="sess-stat-l">Done</div></div>
      <div class="sess-stat"><div class="sess-stat-v" style="font-size:${volStr.length>5?'13':'20'}px;padding-top:${volStr.length>5?'4':'0'}px">${volStr}</div><div class="sess-stat-l">Volume</div></div>
    </div>

    <div class="sess-share-bar">
      <button class="sess-share-btn" onclick="downloadCardFromHistory(${sess.id})">⬇ Download Session Card</button>
    </div>
  </div>`:'';
  return`<div class="sess-card${isOpen?' expanded':''}" id="sess-${sess.id}">
    <div class="sess-card-hdr" onclick="toggleSessExpand(${sess.id})">
      <span class="sess-day-pill pill-${sess.dayId}">${sess.dayName}</span>
      <div class="sess-meta">
        <div class="sess-date">${fmtDate(sess.date)}</div>
        <div class="sess-sub">${fmtTimeLbl(sess.date)}${durStr?' · '+durStr:''} · ${sess.exercises.length} exercises · ${volStr}</div>
      </div>
      <div class="sess-pb-dots">${hasAT?'<div class="pb-dot pb-dot-gold"></div>':''}${hasLS?'<div class="pb-dot pb-dot-green"></div>':''}</div>
      <span class="sess-chevron">▾</span>
    </div>${bodyHTML}
  </div>`;
}

function renderHistoryExercise(sess,ex,pbMap){
  const flags=getPBFlags(pbMap,ex.name,sess.id);
  const{atW,atR,lsW,lsR,prevBestW,prevBestR}=flags;
  const allTimeW=pbMap[ex.name]?.allTimeW||0,allTimeR=pbMap[ex.name]?.allTimeR||0;
  const badges=[atW?'<span class="pb-badge pb-at-w">★ Weight PB</span>':'',atR?'<span class="pb-badge pb-at-r">★ Reps PB</span>':'',lsW&&!atW?'<span class="pb-badge pb-ls-w">↑ Weight</span>':'',lsR&&!atR?'<span class="pb-badge pb-ls-r">↑ Reps</span>':''].filter(Boolean).join('');
  const volDisp=ex.volume>0?`<span class="sess-ex-vol">${ex.volume.toLocaleString()} ${sess.unit}</span>`:(ex.hasBW?`<span class="sess-ex-vol" style="color:var(--blue)">BW</span>`:'');
  const setsHTML=ex.sets.map((s,i)=>{
    if(!s.w&&!s.r&&!s.isBW)return'';
    const w=s.isBW?(parseFloat(s.extra)||0):(parseFloat(s.w)||0),r=parseInt(s.r)||0;
    const isAT=(w>0&&w>=allTimeW)||(r>0&&r>=allTimeR);
    const wStr=s.isBW?`BW${s.extra&&parseFloat(s.extra)>0?` +${s.extra} ${sess.unit||'kg'}`:''}`:(s.w?s.w+' '+(sess.unit||'kg'):'—');
    return`<div class="sess-set-row${isAT?' is-atpb':''}"><span class="sess-set-num">Set ${i+1}</span><span class="sess-set-data">${wStr} × ${s.r||'—'} reps</span>${isAT?'<span class="sess-set-pb">★</span>':''}${s.done?'<span class="sess-set-done">✓</span>':''}</div>`;
  }).filter(Boolean).join('');
  const prevLine=(lsW&&prevBestW!=null)||(lsR&&prevBestR!=null)?`<div style="font-family:var(--mono);font-size:9px;color:var(--txt3);padding:4px 14px 8px;opacity:.7">Previous best: ${prevBestW!=null&&prevBestW>0?prevBestW+' '+(sess.unit||'kg'):''} ${prevBestR!=null&&prevBestR>0?'× '+prevBestR+' reps':''}</div>`:'';
  return`<div class="sess-ex"><div class="sess-ex-hdr"><span class="sess-ex-name">${ex.name}</span>${volDisp}<div class="sess-ex-badges">${badges}</div></div>${setsHTML||'<div style="padding:7px 14px;font-family:var(--mono);font-size:10px;color:var(--txt3)">No data logged</div>'}${prevLine}</div>`;
}

function downloadCardFromHistory(sessId){
  const sess=sessionHistory.find(s=>s.id===sessId);
  if(!sess) return;
  const pbMap=getCachedPBMap(); // use cache — no need to recompute for card download (Fix #5)
  downloadCard(sess, pbMap);
}

async function completeSession(){
  const day=DAYS.find(d=>d.id===activeDay),sel=selected[activeDay];
  if(sel.size===0) return;
  haptic('complete');
  const duration=sessionStartTimes[activeDay]?Date.now()-sessionStartTimes[activeDay]:null;
  sessionStartTimes[activeDay]=null;
  clearInterval(clockInterval); clockInterval=null;
  await saveSessionToHistory(day,sel,duration);
  // Fix #7: clear notes for this day now that they are saved into history,
  // so the next session on this day starts with a clean notes field
  sessionNotes[day.id]='';
  try { await window.storage.set('wab_notes', JSON.stringify(sessionNotes)); } catch(e){}
  const pbMap=getCachedPBMap(); // cache already invalidated by saveSessionToHistory (Fix #5)
  showCompletionModal(day,sel,pbMap,sessionHistory[0]);
  showToast('Session saved ✓');
}

    </div>
    <div class="modal-actions">
      <button class="modal-share-btn" onclick="downloadCard(sessionHistory[0],getCachedPBMap())">⬇ Share Card</button>
      <button class="modal-close-btn" onclick="closeModal()">Close</button>
    </div>
  </div>`;
  modal.classList.add('open'); document.body.style.overflow='hidden';
}
function closeModal(){document.getElementById('_modal').classList.remove('open');document.body.style.overflow='';}

// ═══════════════════════════════════════════════════
//  VIDEO
// ═══════════════════════════════════════════════════
function toggleVideo(dayId,idx){
  const s=videoOpen[dayId];s.has(idx)?s.delete(idx):s.add(idx);
  const fgArea=document.getElementById(`fg-area-${dayId}-${idx}`);
  if(fgArea) fgArea.outerHTML=renderFormGuideArea(dayId,idx,DAYS.find(d=>d.id===dayId).exercises[idx].n);
  else render();
}
function openVideoModal(dayId,idx,exName){
  const url=VIDEO_URLS[exName]||'',hasVideo=!isPlaceholder(url);
  document.getElementById('vmodal-title').textContent=exName;
  const wrap=document.getElementById('vmodal-video-wrap');
  wrap.innerHTML=hasVideo
    ?`<video src="${url}" muted loop playsinline autoplay style="width:100%;height:100%;object-fit:contain;display:block"></video>`
    :`<div class="vmodal-placeholder"><div class="vmodal-placeholder-icon">▶</div><div class="vmodal-placeholder-text">Video not yet linked<br>Replace placeholder URL in VIDEO_URLS</div></div>`;
  document.getElementById('_vmodal').classList.add('open'); document.body.style.overflow='hidden';
}
function closeVideoModal(){const vm=document.getElementById('_vmodal');const v=vm.querySelector('video');if(v){v.pause();v.src='';}vm.classList.remove('open');document.body.style.overflow='';}

// ═══════════════════════════════════════════════════
//  ACTIONS
// ═══════════════════════════════════════════════════
function setDay(id){ activeDay=id; clearInterval(clockInterval); clockInterval=null; render(); if(sessionStartTimes[id]) startSessionClock(id); }

function setUnit(u){
  if(u===unit)return;const prev=unit;unit=u;
  for(const d of DAYS) for(const exIdx in logs[d.id]) if(Array.isArray(logs[d.id][exIdx]))
    logs[d.id][exIdx]=logs[d.id][exIdx].map(s=>({...s,w:s.isBW?s.w:cvtW(s.w,prev,u),extra:s.isBW?cvtW(s.extra,prev,u):s.extra}));
  render(); scheduleSave();
}

function toggleEx(dayId,idx){
  haptic('select');
  const s=selected[dayId]; s.has(idx)?s.delete(idx):(s.add(idx),initExLog(dayId,idx));
  if(selected[dayId].size===1&&!sessionStartTimes[dayId]) startSessionClock(dayId);
  render(); scheduleSave();
}

function updateLog(dayId,exIdx,setIdx,field,value){
  initExLog(dayId,exIdx); logs[dayId][exIdx][setIdx][field]=value;
  updateVolumeDisplay(dayId,exIdx); scheduleSave();
}

function updateNote(dayId,value){sessionNotes[dayId]=value;scheduleSave();}

function toggleDone(dayId,exIdx,setIdx){
  haptic('done');
  initExLog(dayId,exIdx);if(!logs[dayId][exIdx][setIdx])return;
  const isDone=!logs[dayId][exIdx][setIdx].done; logs[dayId][exIdx][setIdx].done=isDone;
  const row=document.getElementById(`srow-${dayId}-${exIdx}-${setIdx}`);
  if(row){
    row.classList.toggle('set-done',isDone);
    const btn=row.querySelector('.done-btn'),num=row.querySelector('.set-num');
    if(btn){btn.classList.toggle('on',isDone);btn.textContent=isDone?'✓':'○';}
    if(num) num.style.color=isDone?'var(--green)':'';
    row.querySelectorAll('.set-in,.set-extra').forEach(inp=>{inp.style.color=isDone?'var(--green)':'';inp.style.borderColor=isDone?'var(--gbdr)':'';});
  }
  scheduleSave();
}

function toggleSetBW(dayId,exIdx,setIdx){
  initExLog(dayId,exIdx);const s=logs[dayId][exIdx][setIdx];if(!s)return;
  s.isBW=!s.isBW;if(s.isBW){s.extra=s.w;s.w='';}else{s.w=s.extra;s.extra='';}
  const day=DAYS.find(d=>d.id===dayId),setCount=parseSetCount(day.exercises[exIdx].s),exLogs=logs[dayId][exIdx];
  const setLog=document.querySelector(`#srow-${dayId}-${exIdx}-0`)?.closest('.set-log');
  if(setLog){setLog.outerHTML=renderSets(dayId,exIdx,setCount,exLogs);}else{render();return;}
  updateVolumeDisplay(dayId,exIdx);scheduleSave();
}

function toggleSessExpand(sessId){expandedSess.has(sessId)?expandedSess.delete(sessId):expandedSess.add(sessId);render();}

// ═══════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════
(async()=>{
  try{ await loadAll(); }catch(e){}
  setTheme(theme);
  render(); renderTimer();
})();
</script>
